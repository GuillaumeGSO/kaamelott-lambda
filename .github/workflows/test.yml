name: Tests

on:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24 # matches the Lambda runtime (NODEJS_24_X)
          cache: npm

      - run: npm ci

      - run: npm test
